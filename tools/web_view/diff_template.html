<!DOCTYPE html>
<html lang="en-us"><head>
<title>
{INSERT_TITLE}
</title>
<meta charset="utf-8">
   <!--DOCUMENTATION: https://github.com/rtfpessoa/diff2html#features -->

   <!-- LINKS TO EXTERNAL REFERENCES
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/10.7.1/styles/github.min.css" />
   <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/diff2html/bundles/css/diff2html.min.css" />
   <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/diff2html/bundles/js/diff2html-ui.min.js"></script>
   -->

   <!--Make sure to load the CSS file in that order-->
   <link rel="stylesheet" type="text/css" href="{WEB_VIEW_FOLDER}/lib/highlight.js_github.min.css" />
   <link rel="stylesheet" type="text/css" href="{WEB_VIEW_FOLDER}/lib/diff2html.min.css" />
   <link rel="stylesheet" type="text/css" href="{WEB_VIEW_FOLDER}/optitrust_diff.css" />
   <script type="text/javascript" src="{WEB_VIEW_FOLDER}/lib/diff2html-ui.min.js"></script>
   <script type="module" src="{WEB_VIEW_FOLDER}/optitrust_syntax_highlight.js"></script>
   <script src="{WEB_VIEW_FOLDER}/optitrust_interactive_code.js"></script>

<script>
   window.optitrustVsCodeApi = window.optitrustVsCodeApi || (typeof acquireVsCodeApi === "function" ? acquireVsCodeApi() : undefined);
   var vscode = window.optitrustVsCodeApi;
   var diffStrings = { cpp: "" };
   var selectedDiffRepresentation = "cpp";
   var pendingDiffRepresentation = "";

   {INSERT_DIFF}

   function diffLabel(representation) {
     if (representation === "cpp") return "C/C++";
     if (representation === "surface") return "Surface";
     if (representation === "internal") return "Internal";
     if (representation === "typed") return "Fully-Typed";
     return representation;
   }

   function availableDiffRepresentations() {
     return ["cpp", "surface", "internal", "typed"].filter(function (representation) {
       return diffStrings[representation] !== undefined && diffStrings[representation] !== "";
     });
   }

   function allDiffRepresentations() {
     return ["cpp", "surface", "internal", "typed"];
   }

   function hasDiffRepresentation(representation) {
     return diffStrings[representation] !== undefined && diffStrings[representation] !== "";
   }

   function renderDiff(representation) {
     if (!hasDiffRepresentation(representation)) {
       requestDiffRepresentation(representation);
       return;
     }
     selectedDiffRepresentation = representation;
     var targetElement = document.getElementById('diffDiv');
     targetElement.innerHTML = "";
     var configuration = {
         inputFormat: 'json',
         drawFileList: false,
         // fileListToggle: false,
         // fileListStartVisible: false
         fileContentToggle: false,
         matching: 'lines',
         outputFormat: 'side-by-side',
         synchronisedScroll: true,
         highlight: false,
         renderNothingWhenEmpty: false,
         // LATER tune?
         // matchWordsThreshold : similarity threshold for word matching, default is 0.25
         // matchWordsThresholdmatchingMaxComparisons: perform at most this much comparisons for line matching a block of changes, default is 2500
         // maxLineSizeInBlockForComparison: maximum number os characters of the bigger line in a block to apply comparison, default is 200
         // maxLineLengthHighlight: only perform diff changes highlight if lines are smaller than this, default is 10000
         };
     var diff2htmlUi = new Diff2HtmlUI(targetElement, diffStrings[representation] || "", configuration);
     diff2htmlUi.draw();
     applyDiffLanguage(targetElement, representation);
     highlightRenderedDiff(targetElement, function () {
       diff2htmlUi.highlightCode();
     }).then(function () {
       if (window.OptitrustInteractiveCode) {
       window.OptitrustInteractiveCode.enhanceDiff(targetElement, representation, diffStrings.typed);
       }
     });
   }

   function requestDiffRepresentation(representation) {
     pendingDiffRepresentation = representation;
     updateDiffRepresentationSelector();
     var targetElement = document.getElementById('diffDiv');
     targetElement.innerHTML = "<div class='diff-generation-status'>Generating " + diffLabel(representation) + " diff...</div>";
     if (vscode) {
       vscode.postMessage({ type: "optitrust.generateDiffRepresentation", representation: representation });
     } else {
       targetElement.innerHTML = "<div class='diff-generation-status'>This syntax has not been generated yet.</div>";
     }
   }

   window.addEventListener("message", function (event) {
     var message = event.data || {};
     if (message.type !== "optitrust.diffGenerationFailed") {
       return;
     }
     pendingDiffRepresentation = "";
     updateDiffRepresentationSelector();
     var targetElement = document.getElementById('diffDiv');
     targetElement.innerHTML = "<div class='diff-generation-status'>Failed to generate " +
       diffLabel(message.representation || "") + " diff: " + (message.message || "unknown error") + "</div>";
   });

   function applyDiffLanguage(targetElement, representation) {
     var language = representation === "cpp" ? "cpp" : "opti";
     targetElement.querySelectorAll(".d2h-file-wrapper").forEach(function (wrapper) {
       wrapper.setAttribute("data-lang", language);
     });
   }

   function highlightRenderedDiff(targetElement, fallback) {
     if (!window.OptitrustSyntaxHighlight) {
       targetElement.dataset.optitrustHighlighter = "fallback";
       fallback();
       return Promise.resolve();
     }
     return window.OptitrustSyntaxHighlight.highlightDiff(targetElement).catch(function (error) {
       console.warn("OptiTrust syntax highlighting failed; using Diff2Html fallback.", error);
       targetElement.dataset.optitrustHighlighter = "fallback";
       fallback();
     });
   }

   function initDiffRepresentationSelector() {
     updateDiffRepresentationSelector();
     var controls = document.getElementById("diffRepresentationControls");
     controls.addEventListener("change", function (event) {
       if (event.target && event.target.name === "diffRepresentation") {
         renderDiff(event.target.value);
       }
     });
   }

   function updateDiffRepresentationSelector() {
     var representations = allDiffRepresentations();
     var toolbar = document.getElementById("diffControls");
     var controls = document.getElementById("diffRepresentationControls");
     if (representations.length <= 1) {
       toolbar.style.display = "none";
       return;
     }
     toolbar.style.display = "flex";
     controls.innerHTML = representations.map(function (representation) {
       var checked = representation === selectedDiffRepresentation ? " checked" : "";
       var generatedClass = hasDiffRepresentation(representation) ? " diff-representation-generated" : " diff-representation-missing";
       var pendingClass = representation === pendingDiffRepresentation ? " diff-representation-pending" : "";
       return "<label class='diff-representation-choice'>" +
         "<input type='radio' name='diffRepresentation' value='" + representation + "'" + checked + ">" +
         "<span class='" + generatedClass + pendingClass + "'>" + diffLabel(representation) + "</span>" +
         "</label>";
     }).join("");
   }

   document.addEventListener('DOMContentLoaded', function () {
     initDiffRepresentationSelector();
     var requestedRepresentation = window.optitrustInitialDiffRepresentation;
     if (requestedRepresentation && hasDiffRepresentation(requestedRepresentation)) {
       selectedDiffRepresentation = requestedRepresentation;
       var requestedChoice = document.querySelector("input[name='diffRepresentation'][value='" + requestedRepresentation + "']");
       if (requestedChoice) {
         requestedChoice.checked = true;
       }
     } else if (diffStrings.surface !== undefined && diffStrings.surface !== "") {
       selectedDiffRepresentation = "surface";
       var surfaceChoice = document.querySelector("input[name='diffRepresentation'][value='surface']");
       if (surfaceChoice) {
         surfaceChoice.checked = true;
       }
     }
     renderDiff(selectedDiffRepresentation);
   });
  // hide line numbers
</script>

</head>

<body>

<div id="diffControls" class="diff-representation-controls">
  <div id="diffRepresentationControls" class="diff-representation-options"></div>
  <div id="diffDetachSlot" class="diff-detach-slot"></div>
</div>
<div id="diffDiv"></div>

</body>
</html>
